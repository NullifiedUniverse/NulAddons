[project]
name = "nulls-addons"
version = "1.0.0"
description = "Hypixel SkyBlock Bazaar-flipping assistant — turns live market data into direct buy/sell commands."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []   # standard library only
license = { text = "MIT" }
authors = [{ name = "Null's Addons" }]
keywords = ["hypixel", "skyblock", "bazaar", "trading", "minecraft", "cli"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/NullifiedUniverse/NulAddons"
Repository = "https://github.com/NullifiedUniverse/NulAddons"
Issues = "https://github.com/NullifiedUniverse/NulAddons/issues"
Changelog = "https://github.com/NullifiedUniverse/NulAddons/blob/main/CHANGELOG.md"

[project.scripts]
nulls-addons = "nulladdons.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["nulladdons"]

[tool.setuptools.package-data]
nulladdons = ["py.typed"]
"*" = ["../data/*.json", "../config/*.json"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
# pyflakes (F), pycodestyle (E/W), isort (I), pyupgrade (UP), flake8-bugbear (B).
select = ["E", "W", "F", "I", "UP", "B"]
ignore = [
    "E501",  # long lines are fine in tables / data-heavy prose
    "E741",  # single-letter names (l/d/f) are idiomatic in the tight math here
]
# E402 (import-not-at-top) is handled per-line with `# noqa: E402` in the test
# files, which insert the repo root on sys.path before importing the package.
