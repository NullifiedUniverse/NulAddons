name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile-check the package
        run: python -m compileall -q nulladdons
      - name: Run the test suite
        run: python -m unittest discover -s tests -v

  lint:
    name: Ruff lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: pip install ruff
      - name: Lint
        run: ruff check nulladdons tests

  java:
    name: Mod core self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Compile core + self-test (Java 8 target)
        run: |
          mkdir -p out
          javac --release 8 -d out \
            $(find mod/src/main/java/com/nullifieduniverse/nulladdons/core -name '*.java') \
            mod/src/test/java/com/nullifieduniverse/nulladdons/core/FlipEngineSelfTest.java
      - name: Run the self-test
        run: java -cp out com.nullifieduniverse.nulladdons.core.FlipEngineSelfTest
